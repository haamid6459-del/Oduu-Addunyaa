<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

body.dark{
  background:#121212;
  color:#fff;
}

header{
  background:#075e54;
  color:white;
  padding:18px 12px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0 0 12px;
}

.search{
  display:flex;
  max-width:700px;
  margin:auto;
  gap:6px;
}

.search input{
  flex:1;
  padding:13px;
  border:0;
  border-radius:8px;
  font-size:16px;
}

.search button{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
}

.tools{
  margin-top:12px;
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
}

.tools button{
  border:0;
  border-radius:20px;
  padding:9px 13px;
  cursor:pointer;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  background:white;
}

.dark .categories{
  background:#1d1d1d;
}

.categories button{
  white-space:nowrap;
  padding:9px 14px;
  border-radius:20px;
  border:1px solid #075e54;
  background:white;
  color:#075e54;
  cursor:pointer;
}

.categories button.active{
  background:#075e54;
  color:white;
}

.dark .categories button{
  background:#222;
  color:white;
}

#status{
  text-align:center;
  padding:15px;
}

.news{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  margin-bottom:16px;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #0002;
}

.dark .card{
  background:#1e1e1e;
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.content{
  padding:15px;
}

.title{
  font-size:20px;
  font-weight:bold;
  line-height:1.4;
}

.description{
  margin-top:10px;
  line-height:1.6;
  color:#555;
}

.dark .description{
  color:#ccc;
}

.meta{
  margin:12px 0;
  color:#777;
  font-size:13px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.actions button,
.actions a{
  border:0;
  border-radius:7px;
  padding:10px 12px;
  text-decoration:none;
  cursor:pointer;
  background:#075e54;
  color:white;
}

.actions .save{
  background:#e0a800;
  color:#111;
}

.empty{
  text-align:center;
  padding:40px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>

<h1>📰 Oduu Addunyaa</h1>

<div class="search">

<input
  id="searchInput"
  placeholder="Oduu barbaadi..."
>

<button onclick="searchNews()">
🔎 Barbaadi
</button>

</div>

<div class="tools">

<button onclick="refreshNews()">
🔄 Haaromsi
</button>

<button onclick="toggleDark()">
🌙 Dark
</button>

<button onclick="showFavorites()">
⭐ Kuufame
</button>

</div>

</header>


<div class="categories">

<button
  class="active"
  onclick="loadCategory('world',this)">
🌍 Addunyaa
</button>

<button
  onclick="loadCategory('Ethiopia',this)">
🇪🇹 Itoophiyaa
</button>

<button
  onclick="loadCategory('Islam',this)">
☪️ Islaamaa
</button>

<button
  onclick="loadCategory('Sports',this)">
⚽ Ispoortii
</button>

<button
  onclick="loadCategory('Technology',this)">
💻 Teknooloojii
</button>

<button
  onclick="loadCategory('Business',this)">
💰 Dinagdee
</button>

</div>


<div id="status">
⏳ Oduu fe'aa jira...
</div>


<main
  id="news"
  class="news">
</main>


<footer>
© 2026 Oduu Addunyaa
</footer>


<script>

const newsBox =
document.getElementById("news");

const statusBox =
document.getElementById("status");

let currentItems = [];

let currentQuery =
"world news OR international news";


// =========================
// ODUU FIDUU
// =========================

async function getNews(query){

currentQuery = query;

statusBox.innerHTML =
"⏳ Oduu haaraa fe'aa jira...";

newsBox.innerHTML = "";

try{

const rss =
"https://news.google.com/rss/search?q="
+
encodeURIComponent(query)
+
"&hl=en-US&gl=US&ceid=US:en";

const api =
"https://api.rss2json.com/v1/api.json?rss_url="
+
encodeURIComponent(rss);

const response =
await fetch(api);

if(!response.ok){
throw new Error("Network error");
}

const data =
await response.json();

if(!data.items ||
data.items.length === 0){

statusBox.innerHTML =
"❌ Oduu hin argamne.";

return;
}

currentItems =
data.items;

showNews(currentItems);

}

catch(error){

console.error(error);

statusBox.innerHTML =
"❌ Oduu fiduu hin dandeenye.";

newsBox.innerHTML = `
<div class="empty">
<p>Internet kee ilaali.</p>
<button onclick="refreshNews()">
🔄 Irra deebi'i
</button>
</div>
`;

}

}


// =========================
// ODUU AGARSIISUU
// =========================

function showNews(items){

statusBox.innerHTML =
"📰 Oduu " + items.length + " argame";

newsBox.innerHTML = "";

items.forEach(function(item,index){

let image =
item.thumbnail ||
getImage(item.description) ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=900";


let title =
clean(item.title || "Oduu");

let description =
clean(item.description || "");

if(description.length > 250){

description =
description.substring(0,250) +
"...";

}


let saved =
isSaved(item.link);


let card =
document.createElement("article");

card.className = "card";

card.innerHTML = `

<img
src="${image}"
onerror="
this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=900'
">

<div class="content">

<div class="title">
${title}
</div>

<div class="description">
${description}
</div>

<div class="meta">
📰 ${item.author || "Madda oduu"}
<br>
🕒 ${formatDate(item.pubDate)}
</div>

<div class="actions">

<a
href="${item.link}"
target="_blank">
🔗 Guutuu dubbisi
</a>

<button
class="save"
onclick="saveNews(${index})">
${saved ? "⭐ Kuufame" : "☆ Kuusi"}
</button>

<button
onclick="speakNews(${index})">
🔊 Dubbisi
</button>

<button
onclick="shareNews(${index})">
📤 Qoodi
</button>

</div>

</div>
`;

newsBox.appendChild(card);

});

}


// =========================
// CATEGORY
// =========================

function loadCategory(category,button){

document
.querySelectorAll(".categories button")
.forEach(function(btn){

btn.classList.remove("active");

});

button.classList.add("active");


let query = "";

if(category === "world"){

query =
"world news OR international news";

}

else if(category === "Ethiopia"){

query =
"Ethiopia news OR Ethiopia latest news";

}

else if(category === "Islam"){

query =
"Islamic news OR Muslim news OR Quran";

}

else if(category === "Sports"){

query =
"sports news OR football news";

}

else if(category === "Technology"){

query =
"technology news OR artificial intelligence";

}

else if(category === "Business"){

query =
"business news OR economy news";

}

getNews(query);

}


// =========================
// SEARCH
// =========================

function searchNews(){

const input =
document.getElementById("searchInput");

const query =
input.value.trim();

if(!query){

alert(
"Maal barbaaduu akka barbaaddu barreessi."
);

return;
}

getNews(query);

}


// Enter
document
.getElementById("searchInput")
.addEventListener("keydown",function(e){

if(e.key === "Enter"){

searchNews();

}

});


// =========================
// REFRESH
// =========================

function refreshNews(){

getNews(currentQuery);

}


// =========================
// FAVORITES
// =========================

function getFavorites(){

try{

return JSON.parse(
localStorage.getItem("favorites") || "[]"
);

}
catch(e){

return [];

}

}


function isSaved(link){

return getFavorites()
.some(function(item){

return item.link === link;

});

}


function saveNews(index){

const item =
currentItems[index];

let favorites =
getFavorites();

if(isSaved(item.link)){

favorites =
favorites.filter(function(x){

return x.link !== item.link;

});

alert("⭐ Oduu kuufame keessaa haqame.");

}

else{

favorites.push(item);

alert("⭐ Oduun kuufame.");

}

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

showNews(currentItems);

}


// =========================
// FAVORITES AGARSIISI
// =========================

function showFavorites(){

const favorites =
getFavorites();

if(favorites.length === 0){

statusBox.innerHTML =
"⭐ Oduu kuufame hin jiru.";

newsBox.innerHTML = `
<div class="empty">
⭐ Ammaaf oduu hin kuufamne.
</div>
`;

return;
}

currentItems =
favorites;

showNews(favorites);

}


// =========================
// SAGALEE
// =========================

function speakNews(index){

const item =
currentItems[index];

if(!window.speechSynthesis){

alert(
"Browser kee sagalee dubbisuu hin deeggaru."
);

return;
}

window.speechSynthesis.cancel();

const text =
clean(item.title || "") +
". " +
clean(item.description || "");

const voice =
new SpeechSynthesisUtterance(text);

voice.lang = "om-ET";

voice.rate = 0.9;

window.speechSynthesis.speak(voice);

}


// =========================
// SHARE
// =========================

async function shareNews(index){

const item =
currentItems[index];

if(navigator.share){

try{

await navigator.share({

title:item.title,

text:item.title,

url:item.link

});

}
catch(e){}

}

else{

try{

await navigator.clipboard.writeText(
item.link
);

alert(
"🔗 Linkiin copy godhameera."
);

}
catch(e){

alert(item.link);

}

}

}


// =========================
// DARK MODE
// =========================

function toggleDark(){

document
.body
.classList
.toggle("dark");

const enabled =
document.body.classList.contains("dark");

localStorage.setItem(
"darkMode",
enabled
);

}


if(
localStorage.getItem("darkMode") === "true"
){

document
.body
.classList
.add("dark");

}


// =========================
// TEXT CLEAN
// =========================

function clean(text){

const div =
document.createElement("div");

div.innerHTML = text;

return div.textContent
.replace(/\s+/g," ")
.trim();

}


// =========================
// SUURAA
// =========================

function getImage(description){

if(!description){
return null;
}

const div =
document.createElement("div");

div.innerHTML =
description;

const img =
div.querySelector("img");

return img ?
img.src :
null;

}


// =========================
// DATE
// =========================

function formatDate(date){

if(!date){
return "";
}

const d =
new Date(date);

if(isNaN(d.getTime())){
return "";
}

return d.toLocaleString(
"om-ET",
{
dateStyle:"medium",
timeStyle:"short"
}
);


// =========================
// JALQABAA
// =========================

getNews(
"world news OR international news"
);

</script>

</body>
  </html>
