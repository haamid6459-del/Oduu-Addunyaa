<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
}

header{
  background:#075e54;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

button{
  margin-top:15px;
  padding:10px 18px;
  border:0;
  border-radius:8px;
  background:white;
  color:#075e54;
  font-weight:bold;
}

#status{
  text-align:center;
  padding:18px;
  font-size:16px;
}

#news{
  max-width:800px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  margin-bottom:18px;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.content{
  padding:16px;
}

.title{
  font-size:20px;
  font-weight:bold;
  line-height:1.4;
}

.desc{
  margin-top:10px;
  line-height:1.6;
  color:#555;
}

.date{
  margin-top:8px;
  font-size:13px;
  color:#888;
}

.link{
  display:inline-block;
  margin-top:14px;
  padding:11px 15px;
  background:#075e54;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>
</head>

<body>

<header>

<h1>📰 Oduu Addunyaa</h1>

<button onclick="loadNews()">
🔄 Oduu Haaraa
</button>

</header>

<div id="status">
⏳ Oduu fe'aa jira...
</div>

<div id="news"></div>


<script>

async function loadNews(){

const status = document.getElementById("status");
const news = document.getElementById("news");

status.innerHTML = "⏳ Oduu fe'aa jira...";
news.innerHTML = "";


/* BBC WORLD RSS */

const rss =
"https://feeds.bbci.co.uk/news/world/rss.xml";


/* RSS → JSON API */

const api =
"https://rss-to-json-serverless-api.vercel.app/api?url="
+
encodeURIComponent(rss);


try{

const response = await fetch(api);

if(!response.ok){

throw new Error("API hin deebine");

}

const data = await response.json();

console.log(data);


/* DATA CHECK */

let items =
data.items ||
data.entries ||
data.feed?.items ||
[];


if(items.length === 0){

status.innerHTML =
"❌ Oduu hin argamne.";

return;

}


status.innerHTML =
"✅ Oduu haaraa " + items.length + " argame";


/* NEWS */

items.slice(0,20).forEach(item => {


let title =
item.title || "Mata-dureen hin jiru";


let description =
item.description ||
item.content ||
"Oduu guutuu dubbisuuf cuqaasi.";


let link =
item.link || "#";


let image =
item.thumbnail ||
item.enclosure?.link ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c";


let date =
item.pubDate ||
item.isoDate ||
"";


let card =
document.createElement("div");


card.className = "card";


card.innerHTML = `

<img
src="${image}"
onerror="this.style.display='none'"
>

<div class="content">

<div class="title">
${title}
</div>

<div class="date">
📅 ${date}
</div>

<div class="desc">
${description}
</div>

<a
class="link"
href="${link}"
target="_blank">
Oduu guutuu dubbisi →
</a>

</div>

`;


news.appendChild(card);

});

}

catch(error){

console.log(error);

status.innerHTML =
"❌ Oduu fiduun dadhabe.";

news.innerHTML = `

<div class="card">

<div class="content">

<h2>Rakkoo API</h2>

<p>
Appichi banuu danda'a, garuu server oduu irraa
odeeffannoo deebii hin arganne.
</p>

<p>
Mee button 🔄 Oduu Haaraa jedhu cuqaasi.
</p>

</div>

</div>

`;

}

}


/* START */

loadNews();

</script>

</body>
</html>
