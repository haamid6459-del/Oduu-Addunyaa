<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f5;
}

header{
  background:#075e54;
  color:white;
  padding:20px;
  text-align:center;
}

#status{
  text-align:center;
  padding:15px;
  font-weight:bold;
}

#news{
  max-width:800px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  margin-bottom:18px;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #0002;
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.content{
  padding:15px;
}

.title{
  font-size:20px;
  font-weight:bold;
  line-height:1.4;
}

.date{
  color:#777;
  font-size:13px;
  margin-top:8px;
}

.description{
  margin-top:10px;
  line-height:1.6;
  color:#444;
}

.link{
  display:inline-block;
  margin-top:12px;
  padding:10px 15px;
  background:#075e54;
  color:white;
  text-decoration:none;
  border-radius:7px;
}
</style>
</head>

<body>

<header>
<h1>📰 Oduu Addunyaa</h1>
</header>

<div id="status">
⏳ Oduu fe'aa jira...
</div>

<div id="news"></div>

<script>

async function loadNews(){

const status = document.getElementById("status");
const news = document.getElementById("news");

news.innerHTML = "";

try{

const rss =
"https://feeds.bbci.co.uk/news/world/rss.xml";

const api =
"https://api.rss2json.com/v1/api.json?rss_url="
+ encodeURIComponent(rss);

const response = await fetch(api);

if(!response.ok){
throw new Error("API error");
}

const data = await response.json();

console.log(data);

if(data.status !== "ok"){
throw new Error("News feed failed");
}

if(!data.items || data.items.length === 0){

status.innerHTML =
"❌ Oduu hin argamne.";

return;
}

status.innerHTML =
"✅ Oduu haaraa argame";

data.items.forEach(item => {

let image =
item.thumbnail ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c";

let description =
item.description || "";

let card =
document.createElement("div");

card.className = "card";

card.innerHTML = `

<img
src="${image}"
onerror="this.style.display='none'"
>

<div class="content">

<div class="title">
${item.title}
</div>

<div class="date">
📅 ${item.pubDate || ""}
</div>

<div class="description">
${description}
</div>

<a
class="link"
href="${item.link}"
target="_blank">
Oduu guutuu dubbisi →
</a>

</div>

`;

news.appendChild(card);

});

}

catch(error){

console.error(error);

status.innerHTML =
"❌ Oduu fiduun dadhabe.";

news.innerHTML = `
<div class="card">
<div class="content">
<h2>Rakkoo uumame</h2>
<p>
Internet kee ilaali. Yoo internet jiraate,
API oduu irratti rakkoon jiraachuu danda'a.
</p>
</div>
</div>
`;

}

}

loadNews();

</script>

</body>
</html>
