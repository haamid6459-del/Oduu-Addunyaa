<!DOCTYPE html>
<html lang="om">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa Afaan Oromoo</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f4f7;
color:#222;
}

header{
background:#075e54;
color:white;
padding:20px 12px;
text-align:center;
}

header h1{
margin:0 0 15px;
}

.search{
display:flex;
gap:7px;
max-width:700px;
margin:auto;
}

.search input{
flex:1;
padding:13px;
border:0;
border-radius:8px;
font-size:16px;
}

.search button{
border:0;
border-radius:8px;
padding:13px 17px;
background:white;
color:#075e54;
font-weight:bold;
}

.categories{
display:flex;
overflow-x:auto;
gap:8px;
padding:12px;
background:white;
}

.categories button{
white-space:nowrap;
border:0;
padding:10px 15px;
border-radius:20px;
background:#e8eeee;
font-weight:bold;
}

#status{
text-align:center;
padding:18px;
font-weight:bold;
}

#news{
max-width:800px;
margin:auto;
padding:10px;
}

.card{
background:white;
margin-bottom:18px;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 8px #0002;
}

.card img{
width:100%;
height:210px;
object-fit:cover;
}

.content{
padding:16px;
}

.title{
font-size:20px;
font-weight:bold;
line-height:1.5;
}

.original{
margin-top:8px;
padding:10px;
background:#f1f3f4;
border-radius:8px;
font-size:14px;
color:#666;
}

.desc{
margin-top:12px;
line-height:1.7;
color:#444;
}

.source{
margin-top:10px;
font-size:13px;
color:#777;
}

.read{
display:inline-block;
margin-top:14px;
padding:11px 15px;
background:#075e54;
color:white;
text-decoration:none;
border-radius:8px;
}

</style>

</head>


<body>


<header>

<h1>📰 Oduu Addunyaa</h1>

<div class="search">

<input
id="search"
type="text"
placeholder="🔍 Oduu barbaadi..."
>

<button onclick="searchNews()">
Barbaadi
</button>

</div>

</header>


<div class="categories">

<button onclick="loadNews('world')">
🌍 Addunyaa
</button>

<button onclick="loadNews('Ethiopia')">
🇪🇹 Itoophiyaa
</button>

<button onclick="loadNews('Africa')">
🌍 Afrikaa
</button>

<button onclick="loadNews('Islam')">
🕌 Islaamaa
</button>

<button onclick="loadNews('sports')">
⚽ Ispoortii
</button>

<button onclick="loadNews('technology')">
💻 Teknooloojii
</button>

<button onclick="loadNews('business')">
💰 Dinagdee
</button>

</div>


<div id="status">
⏳ Oduu fe'aa jira...
</div>


<div id="news"></div>


<script>


const NEWS_API =
"https://freenewsapi.ai/v1/search";


/*
=====================================
NEWS API
=====================================
*/


async function getNews(query){

const url =
NEWS_API +
"?q=" +
encodeURIComponent(query) +
"&size=20";

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"News API error"
);

}

return await response.json();

}


/*
=====================================
TRANSLATION
=====================================

As keessatti yeroo booda
Google Translation Backend
galchuu dandeenya.

Ammaaf oduu original
ni agarsiisa.
*/


async function translateToOromo(text){

/*
GOOGLE TRANSLATION BACKEND
bakka kana booda galchina.

Fakkeenya:

const response = await fetch(
"https://YOUR-BACKEND/translate",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
text:text,
target:"om"
})
}
);

const data = await response.json();

return data.translation;
*/

return text;

}


/*
=====================================
LOAD NEWS
=====================================
*/


async function loadNews(query){

const status =
document.getElementById("status");

const news =
document.getElementById("news");


status.innerHTML =
"⏳ Oduu barbaadaa jira...";

news.innerHTML = "";


try{

const data =
await getNews(query);


const articles =
data.results || [];


if(articles.length === 0){

status.innerHTML =
"❌ Oduu hin argamne.";

return;

}


status.innerHTML =
"✅ Oduu " +
articles.length +
" argame";


for(
const article of articles
){

const originalTitle =
article.title || "";


const originalDescription =
article.description || "";


const title =
await translateToOromo(
originalTitle
);


const description =
await translateToOromo(
originalDescription
);


const image =
article.image ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c";


const link =
article.url || "#";


const source =
article.sitename ||
article.host ||
"Madda hin beekamne";


const date =
article.published_at || "";


const card =
document.createElement("div");


card.className =
"card";


card.innerHTML = `

<img
src="${image}"
onerror="
this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c'
">

<div class="content">

<div class="title">
${title}
</div>

<div class="original">
Afaan jalqabaa:<br>
${originalTitle}
</div>

<div class="desc">
${description}
</div>

<div class="source">
📰 ${source}
</div>

<div class="source">
📅 ${date}
</div>

<a
class="read"
href="${link}"
target="_blank">

Oduu guutuu dubbisi →

</a>

</div>
`;


news.appendChild(card);

}

}

catch(error){

console.error(error);


status.innerHTML =
"❌ Oduu fiduun dadhabe.";


news.innerHTML = `

<div class="card">

<div class="content">

<h2>Rakkoo uumame</h2>

<p>
Internet ykn server oduu ilaali.
</p>

</div>

</div>

`;

}

}


/*
=====================================
SEARCH
=====================================
*/


function searchNews(){

const text =
document
.getElementById("search")
.value
.trim();


if(text === ""){

loadNews("world");

return;

}


loadNews(text);

}


/*
=====================================
START
=====================================
*/


loadNews("world");


</script>


</body>
  </html>
