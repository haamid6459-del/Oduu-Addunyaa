<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#222;
}

header{
  background:#075e54;
  color:white;
  padding:20px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0 0 15px;
}

.search{
  display:flex;
  gap:8px;
  max-width:700px;
  margin:auto;
}

.search input{
  flex:1;
  padding:13px;
  border:0;
  border-radius:8px;
  font-size:16px;
}

.search button{
  padding:13px 18px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#075e54;
  font-weight:bold;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  background:white;
}

.categories button{
  white-space:nowrap;
  border:0;
  padding:10px 15px;
  border-radius:20px;
  background:#e9eeee;
  font-weight:bold;
}

#status{
  text-align:center;
  padding:18px;
  font-weight:bold;
}

#news{
  max-width:800px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  margin-bottom:18px;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px #0002;
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.content{
  padding:16px;
}

.title{
  font-size:20px;
  font-weight:bold;
  line-height:1.45;
}

.desc{
  margin-top:10px;
  color:#555;
  line-height:1.6;
}

.source{
  margin-top:10px;
  color:#777;
  font-size:13px;
}

.read{
  display:inline-block;
  margin-top:14px;
  padding:11px 15px;
  background:#075e54;
  color:white;
  text-decoration:none;
  border-radius:8px;
}

.error{
  background:white;
  padding:25px;
  border-radius:12px;
  text-align:center;
}
</style>
</head>

<body>

<header>

<h1>📰 Oduu Addunyaa</h1>

<div class="search">

<input
id="search"
type="text"
placeholder="🔍 Oduu barbaadi..."
>

<button onclick="searchNews()">
Barbaadi
</button>

</div>

</header>


<div class="categories">

<button onclick="loadNews('world')">
🌍 Addunyaa
</button>

<button onclick="loadNews('Ethiopia')">
🇪🇹 Itoophiyaa
</button>

<button onclick="loadNews('Islam')">
🕌 Islaamaa
</button>

<button onclick="loadNews('sports')">
⚽ Ispoortii
</button>

<button onclick="loadNews('technology')">
💻 Teknooloojii
</button>

<button onclick="loadNews('business')">
💰 Dinagdee
</button>

</div>


<div id="status">
⏳ Oduu fe'aa jira...
</div>


<div id="news"></div>


<script>

const API =
"https://freenewsapi.ai/v1/search";


async function loadNews(query="world"){

const status =
document.getElementById("status");

const news =
document.getElementById("news");

status.innerHTML =
"⏳ Oduu barbaadaa jira...";

news.innerHTML = "";


try{

const url =
API +
"?q=" +
encodeURIComponent(query) +
"&size=20";


const response =
await fetch(url);


if(!response.ok){

throw new Error(
"API error " + response.status
);

}


const data =
await response.json();


console.log(data);


const articles =
data.results || [];


if(articles.length === 0){

status.innerHTML =
"❌ Oduu hin argamne.";

return;

}


status.innerHTML =
"✅ Oduu " +
articles.length +
" argame";


articles.forEach(article => {


const card =
document.createElement("div");

card.className =
"card";


const title =
article.title ||
"Mata-duree hin jiru";


const link =
article.url ||
"#";


const date =
article.published_at ||
"";


const host =
article.host ||
"Madda hin beekamne";


let image =
article.image ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c";


card.innerHTML = `

<img
src="${image}"
onerror="
this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c'
">

<div class="content">

<div class="title">
${title}
</div>

<div class="source">
📰 ${host}
</div>

<div class="source">
📅 ${date}
</div>

<a
class="read"
href="${link}"
target="_blank">
Oduu guutuu dubbisi →
</a>

</div>

`;


news.appendChild(card);

});

}


catch(error){

console.error(error);


status.innerHTML =
"❌ Oduu fiduun dadhabe.";


news.innerHTML = `

<div class="error">

<h2>Rakkoon uumame</h2>

<p>
Internet kee ilaali ykn daqiiqaa muraasa booda
irra deebi'i.
</p>

</div>

`;

}

}


async function searchNews(){

const text =
document.getElementById("search").value.trim();


if(text === ""){

loadNews("world");

return;

}


loadNews(text);

}


loadNews("world");

</script>

</body>
  </html>
