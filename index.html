<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f2f4f5;
  color:#222;
}

header{
  background:#075e54;
  color:white;
  padding:18px 12px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:25px;
}

header p{
  font-size:13px;
  margin-top:5px;
}

.search{
  background:white;
  padding:12px;
}

.search input{
  width:100%;
  padding:13px 16px;
  border:1px solid #ddd;
  border-radius:25px;
  font-size:15px;
  outline:none;
}

.categories{
  background:white;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px;
}

.categories button{
  border:0;
  background:#e8eeee;
  padding:10px 15px;
  border-radius:20px;
  white-space:nowrap;
}

.categories button.active{
  background:#075e54;
  color:white;
}

.refresh{
  padding:10px;
}

.refresh button{
  width:100%;
  border:0;
  padding:12px;
  border-radius:8px;
  background:#128c7e;
  color:white;
  font-size:16px;
}

#news{
  padding:10px;
}

.card{
  background:white;
  margin-bottom:16px;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #0002;
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.content{
  padding:14px;
}

.content h2{
  font-size:19px;
  line-height:1.4;
  margin-bottom:8px;
}

.content p{
  font-size:14px;
  line-height:1.6;
  color:#555;
}

.info{
  display:flex;
  justify-content:space-between;
  margin-top:12px;
  font-size:12px;
  color:#777;
}

.read{
  display:inline-block;
  margin-top:12px;
  background:#075e54;
  color:white;
  text-decoration:none;
  padding:9px 14px;
  border-radius:7px;
}

.loading{
  text-align:center;
  padding:35px;
}

.error{
  margin:10px;
  padding:15px;
  border-radius:8px;
  background:#ffe3e3;
  color:#a00000;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🌍 ODUU ADDUNYAA</h1>
  <p>Oduu haaraa Afaan Oromootiin</p>
</header>

<div class="search">
  <input
    id="search"
    type="text"
    placeholder="🔎 Oduu barbaadi..."
    oninput="searchNews()">
</div>

<div class="categories">

  <button class="active"
    onclick="loadCategory('world',this)">
    🌍 Addunyaa
  </button>

  <button onclick="loadCategory('ethiopia',this)">
    🇪🇹 Itoophiyaa
  </button>

  <button onclick="loadCategory('islam',this)">
    🕌 Islaamaa
  </button>

  <button onclick="loadCategory('sport',this)">
    ⚽ Ispoortii
  </button>

  <button onclick="loadCategory('technology',this)">
    💻 Teknooloojii
  </button>

  <button onclick="loadCategory('business',this)">
    💰 Dinagdee
  </button>

</div>

<div class="refresh">
  <button onclick="getNews()">
    🔄 Oduu Haaraa Haaromsi
  </button>
</div>

<div id="news">
  <div class="loading">
    ⏳ Oduu barbaadaa jira...
  </div>
</div>

<footer>
  © 2026 Oduu Addunyaa
</footer>

<script>

let currentCategory = "world";
let allNews = [];

const feeds = {

  world:
  "https://news.google.com/rss/search?q=world+news&hl=en-US&gl=US&ceid=US:en",

  ethiopia:
  "https://news.google.com/rss/search?q=Ethiopia+news&hl=en-US&gl=US&ceid=US:en",

  islam:
  "https://news.google.com/rss/search?q=Islam+news&hl=en-US&gl=US&ceid=US:en",

  sport:
  "https://news.google.com/rss/search?q=sports+news&hl=en-US&gl=US&ceid=US:en",

  technology:
  "https://news.google.com/rss/search?q=technology+news&hl=en-US&gl=US&ceid=US:en",

  business:
  "https://news.google.com/rss/search?q=business+news&hl=en-US&gl=US&ceid=US:en"

};


/* Kategori filachuu */

function loadCategory(category, button){

  currentCategory = category;

  document
    .querySelectorAll(".categories button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  document.getElementById("search").value = "";

  getNews();
}


/* Oduu fiduu */

async function getNews(){

  const box = document.getElementById("news");

  box.innerHTML = `
    <div class="loading">
      ⏳ Oduu haaraa barbaadaa jira...
    </div>
  `;

  try{

    const rss =
      encodeURIComponent(feeds[currentCategory]);

    const url =
      "https://api.rss2json.com/v1/api.json?rss_url="
      + rss;

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Network error");
    }

    const data = await response.json();

    allNews = data.items || [];

    await displayNews(allNews);

  }

  catch(error){

    box.innerHTML = `
      <div class="error">
        ❌ Oduu fiduun hin danda'amne.
        <br><br>
        Internet kee ilaaliitii irra deebi'i.
      </div>
    `;

  }
}


/* Oduu agarsiisuu */

async function displayNews(news){

  const box = document.getElementById("news");

  if(!news.length){

    box.innerHTML = `
      <div class="loading">
        Oduun hin argamne.
      </div>
    `;

    return;
  }

  box.innerHTML = "";

  for(let item of news.slice(0,20)){

    let title =
      clean(item.title || "Mata-duree hin jiru");

    let description =
      clean(item.description || "");

    /* Gara Afaan Oromootti hiikuu */

    let translatedTitle =
      await translateToOromo(title);

    let translatedDescription =
      await translateToOromo(description);

    if(translatedDescription.length > 300){
      translatedDescription =
        translatedDescription.substring(0,300) + "...";
    }

    let image =
      item.thumbnail ||
      findImage(item.description) ||
      "https://via.placeholder.com/800x450?text=ODUU";

    let date =
      item.pubDate
      ? new Date(item.pubDate).toLocaleDateString("om-ET")
      : "";

    const article = document.createElement("article");

    article.className = "card";

    article.innerHTML = `

      <img
        src="${image}"
        onerror="this.src='https://via.placeholder.com/800x450?text=ODUU'"
        alt="Suuraa oduu">

      <div class="content">

        <h2>
          ${escapeHTML(translatedTitle)}
        </h2>

        <p>
          ${escapeHTML(translatedDescription)}
        </p>

        <div class="info">

          <span>
            📰 ${escapeHTML(item.author || "Madda oduu")}
          </span>

          <span>
            ${date}
          </span>

        </div>

        <a
          class="read"
          href="${item.link}"
          target="_blank"
          rel="noopener">
          Oduu guutuu dubbisi →
        </a>

      </div>
    `;

    box.appendChild(article);
  }
}


/* Afaan Oromootti hiikuu */

async function translateToOromo(text){

  if(!text){
    return "";
  }

  try{

    const url =
      "https://api.mymemory.translated.net/get?q="
      + encodeURIComponent(text.substring(0,450))
      + "&langpair=en|om";

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(
      data &&
      data.responseData &&
      data.responseData.translatedText
    ){

      return data.responseData.translatedText;
    }

  }

  catch(error){

    console.log("Hiikni hin milkoofne");

  }

  return text;
}


/* Search */

function searchNews(){

  const word =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if(!word){

    displayNews(allNews);

    return;
  }

  const result =
    allNews.filter(item =>

      (item.title || "")
      .toLowerCase()
      .includes(word)

      ||

      (item.description || "")
      .toLowerCase()
      .includes(word)

    );

  displayNews(result);
}


/* HTML qulqulleessuu */

function clean(text){

  const div =
    document.createElement("div");

  div.innerHTML = text;

  return div.textContent ||
         div.innerText ||
         "";
}


/* Suuraa keessaa baasuu */

function findImage(description){

  if(!description){
    return null;
  }

  const match =
    description.match(
      /<img[^>]+src=["']([^"']+)["']/i
    );

  return match ? match[1] : null;
}


/* HTML injection ittisuu */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* App yeroo jalqabaatti */

getNews();

</script>

</body>
  </html>
