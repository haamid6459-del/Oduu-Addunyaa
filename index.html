<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f5;
}

header{
  background:#075e54;
  color:white;
  padding:20px;
  text-align:center;
}

h1{
  margin:0;
}

#status{
  text-align:center;
  padding:20px;
  font-size:16px;
}

#news{
  max-width:800px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  margin-bottom:15px;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #0002;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.content{
  padding:15px;
}

.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.description{
  color:#555;
  line-height:1.5;
}

a{
  display:inline-block;
  margin-top:12px;
  background:#075e54;
  color:white;
  padding:10px 14px;
  border-radius:7px;
  text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>📰 Oduu Addunyaa</h1>
</header>

<div id="status">
⏳ Oduu fe'aa jira...
</div>

<div id="news"></div>

<script>

async function loadNews(){

const status =
document.getElementById("status");

const news =
document.getElementById("news");

try{

const rss =
"https://news.google.com/rss/search?q=world%20news&hl=en-US&gl=US&ceid=US:en";

const api =
"https://api.rss2json.com/v1/api.json?rss_url="
+
encodeURIComponent(rss);

const response =
await fetch(api);

const data =
await response.json();

if(!data.items){

status.innerHTML =
"❌ Oduu hin argamne.";

return;

}

status.innerHTML =
"✅ Oduu haaraa";

data.items.forEach(function(item){

let image =
item.thumbnail ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800";

let description =
item.description || "";

let div =
document.createElement("div");

div.className="card";

div.innerHTML=`

<img
src="${image}"
onerror="this.style.display='none'"
>

<div class="content">

<div class="title">
${item.title}
</div>

<div class="description">
${description}
</div>

<a
href="${item.link}"
target="_blank">
Oduu guutuu dubbisi →
</a>

</div>

`;

news.appendChild(div);

});

}

catch(error){

console.log(error);

status.innerHTML =
"❌ Oduu fiduun dadhabe. Internet ykn server ilaali.";

}

}

loadNews();

</script>

</body>
</html>
