<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oduu Addunyaa</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#222;
  transition:.3s;
}

body.dark{
  background:#121212;
  color:#eee;
}

header{
  background:#075e54;
  color:white;
  padding:16px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0 0 12px;
}

.search{
  display:flex;
  gap:7px;
  max-width:800px;
  margin:auto;
}

.search input{
  flex:1;
  padding:13px;
  border:0;
  border-radius:8px;
  font-size:16px;
}

.search button{
  border:0;
  border-radius:8px;
  padding:0 15px;
  font-weight:bold;
}

.tools{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:12px;
  flex-wrap:wrap;
}

.tools button{
  border:0;
  padding:9px 13px;
  border-radius:20px;
  cursor:pointer;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  background:white;
  position:sticky;
  top:123px;
  z-index:15;
}

.dark .categories{
  background:#1d1d1d;
}

.categories button{
  white-space:nowrap;
  border:1px solid #075e54;
  background:white;
  color:#075e54;
  padding:9px 14px;
  border-radius:20px;
}

.dark .categories button{
  background:#222;
  color:#eee;
}

.categories button.active{
  background:#075e54;
  color:white;
}

#status{
  text-align:center;
  padding:15px;
  color:#666;
}

.dark #status{
  color:#bbb;
}

.news{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  margin-bottom:16px;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 2px 9px #0002;
}

.dark .card{
  background:#1e1e1e;
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#ddd;
}

.content{
  padding:15px;
}

.title{
  font-size:20px;
  font-weight:bold;
  line-height:1.45;
  margin-bottom:10px;
}

.description{
  color:#555;
  line-height:1.6;
}

.dark .description{
  color:#ccc;
}

.meta{
  font-size:13px;
  color:#777;
  margin:12px 0;
}

.dark .meta{
  color:#aaa;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.actions button,
.read{
  border:0;
  text-decoration:none;
  padding:10px 13px;
  border-radius:7px;
  cursor:pointer;
  background:#075e54;
  color:white;
}

.favorite{
  background:#e9b949 !important;
  color:#111 !important;
}

.empty{
  text-align:center;
  padding:40px 15px;
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
}
</style>
</head>

<body>

<header>

<h1>📰 Oduu Addunyaa</h1>

<div class="search">

<input
id="searchInput"
type="text"
placeholder="Oduu barbaadi..."
>

<button onclick="searchNews()">
🔎 Barbaadi
</button>

</div>

<div class="tools">

<button onclick="refreshNews()">
🔄 Haaromsi
</button>

<button onclick="toggleDark()">
🌙 Dark
</button>

<button onclick="showFavorites()">
⭐ Kuufame
</button>

</div>

</header>


<div class="categories">

<button class="active"
onclick="loadCategory('world',this)">
🌍 Addunyaa
</button>

<button onclick="loadCategory('Ethiopia',this)">
🇪🇹 Itoophiyaa
</button>

<button onclick="loadCategory('Islam',this)">
☪️ Islaamaa
</button>

<button onclick="loadCategory('Sports',this)">
⚽ Ispoortii
</button>

<button onclick="loadCategory('Technology',this)">
💻 Teknooloojii
</button>

<button onclick="loadCategory('Business',this)">
💰 Dinagdee
</button>

</div>


<div id="status">
⏳ Oduu fe'aa jira...
</div>


<main id="news" class="news"></main>


<footer>
© 2026 Oduu Addunyaa
</footer>


<script>

const newsBox =
document.getElementById("news");

const statusBox =
document.getElementById("status");

let currentCategory="world";

let currentItems=[];


// ==========================
// RSS
// ==========================

function makeRSS(query){

return "https://news.google.com/rss/search?q="
+
encodeURIComponent(query)
+
"&hl=en-US&gl=US&ceid=US:en";

}


// ==========================
// FEED
// ==========================

async function getNews(query){

statusBox.innerHTML=
"⏳ Oduu haaraa fe'aa jira...";

newsBox.innerHTML="";

try{

const rss=makeRSS(query);

const api=
"https://api.rss2json.com/v1/api.json?rss_url="
+
encodeURIComponent(rss);

const response=
await fetch(api);

if(!response.ok)
throw new Error("Network error");

const data=
await response.json();

if(!data.items ||
data.items.length===0){

statusBox.innerHTML=
"❌ Oduun hin argamne.";

return;

}

currentItems=data.items;

showNews(data.items);

}catch(error){

console.log(error);

statusBox.innerHTML=
"❌ Oduu fe'uu hin dandeenye. Internet ilaali.";

}

}


// ==========================
// DISPLAY
// ==========================

function showNews(items){

statusBox.innerHTML=
"📰 Oduu "+items.length+" argame";

newsBox.innerHTML="";

items.forEach((item,index)=>{

let image=
item.thumbnail ||
getImage(item.description) ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=900";


let title=
cleanText(item.title || "Oduu");

let description=
cleanText(item.description || "");

if(description.length>280){

description=
description.substring(0,280)+"...";

}


let saved=
getFavorites().some(
x=>x.link===item.link
);


let card=
document.createElement("article");

card.className="card";

card.innerHTML=`

<img
src="${image}"
onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=900'"
alt="Suuraa oduu"
>

<div class="content">

<div class="title">
${title}
</div>

<div class="description">
${description}
</div>

<div class="meta">
📰 ${item.author || "Madda oduu"}
<br>
🕒 ${formatDate(item.pubDate)}
</div>

<div class="actions">

<a
class="read"
href="${item.link}"
target="_blank"
>
🔗 Guutuu dubbisi
</a>

<button
class="${saved?'favorite':''}"
onclick="saveNews(${index})"
>
${saved?'⭐ Kuufame':'☆ Kuusi'}
</button>

<button
onclick="speakNews(${index})"
>
🔊 Dubbisi
</button>

<button
onclick="shareNews(${index})"
>
📤 Qoodi
</button>

</div>

</div>
`;

newsBox.appendChild(card);

});

}


// ==========================
// SEARCH
// ==========================

function searchNews(){

const q=
document
.getElementById("searchInput")
.value
.trim();

if(!q){

alert("Maal barbaadu akka barbaaddu barreessi.");

return;

}

getNews(q);

}


// ENTER

document
.getElementById("searchInput")
.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
searchNews();
}

});


// ==========================
// CATEGORY
// ==========================

function loadCategory(category,button){

currentCategory=category;

document
.querySelectorAll(".categories button")
.forEach(
btn=>btn.classList.remove("active")
);

button.classList.add("active");


let query="";

if(category==="world")
query="world news OR international news";

if(category==="Ethiopia")
query="Ethiopia news OR Ethiopia latest news";

if(category==="Islam")
query="Islamic news OR Muslim news OR Quran";

if(category==="Sports")
query="sports news OR football news";

if(category==="Technology")
query="technology news OR artificial intelligence";

if(category==="Business")
query="business news OR economy news";


getNews(query);

}


// ==========================
// REFRESH
// ==========================

function refreshNews(){

getNews(
currentCategory==="world"
?
"world news OR international news"
:
currentCategory+" news"
);

}


// ==========================
// FAVORITES
// ==========================

function getFavorites(){

return JSON.parse(
localStorage.getItem("favorites") || "[]"
);

}


function saveNews(index){

const item=currentItems[index];

let favorites=getFavorites();

const exists=
favorites.some(
x=>x.link===item.link
);

if(exists){

favorites=
favorites.filter(
x=>x.link!==item.link
);

alert("⭐ Oduu kuufame keessaa haqame.");

}else{

favorites.push(item);

alert("⭐ Oduun kuufame.");

}

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

showNews(currentItems);

}


// ==========================
// SHOW FAVORITES
// ==========================

function showFavorites(){

const favorites=getFavorites();

if(favorites.length===0){

statusBox.innerHTML=
"⭐ Oduu kuufame hin jiru.";

newsBox.innerHTML=
`
<div class="empty">
⭐ Ammaaf oduu hin kuufamne.
</div>
`;

return;

}

currentItems=favorites;

showNews(favorites);

}


// ==========================
// SPEAK
// ==========================

function speakNews(index){

const item=currentItems[index];

if(!("speechSynthesis" in window)){

alert(
"Browser kee sagalee dubbisuu hin deeggaru."
);

return;

}

speechSynthesis.cancel();

const text=
cleanText(item.title)+
". "+
cleanText(item.description || "");

const speech=
new SpeechSynthesisUtterance(text);

speech.lang="om-ET";

speech.rate=0.9;

speech.pitch=1;

speechSynthesis.speak(speech);

}


// ==========================
// SHARE
// ==========================

async function shareNews(index){

const item=currentItems[index];

const shareData={

title:item.title,

text:item.title,

url:item.link

};


if(navigator.share){

try{

await navigator.share(shareData);

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(
item.link
);

alert(
"🔗 Linkii oduu copy godhame."
);

}catch(e){

alert(item.link);

}

}

}


// ==========================
// DARK MODE
// ==========================

function toggleDark(){

document
.body
.classList
.toggle("dark");

const dark=
document
.body
.classList
.contains("dark");

localStorage.setItem(
"darkMode",
dark
);

}


// ==========================
// LOAD DARK MODE
// ==========================

if(
localStorage.getItem("darkMode")==="true"
){

document
.body
.classList
.add("dark");

}


// ==========================
// CLEAN
// ==========================

function cleanText(text){

const div=
document.createElement("div");

div.innerHTML=text;

return div.textContent
.replace(/\s+/g," ")
.trim();

}


// ==========================
// IMAGE
// ==========================

function getImage(description){

const div=
document.createElement("div");

div.innerHTML=description;

const img=
div.querySelector("img");

return img ? img.src : null;

}


// ==========================
// DATE
// ==========================

function formatDate(date){

if(!date)return "";

const d=new Date(date);

return d.toLocaleString(
"om-ET",
{
dateStyle:"medium",
timeStyle:"short"
}
);


// ==========================
// START
// ==========================

getNews(
"world news OR international news"
);

</script>

</body>
  </html>
